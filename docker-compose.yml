services:
  service1:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

    environment:
      GREETING: "Hello"
      NAME: "World"

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

    restart: unless-stopped
